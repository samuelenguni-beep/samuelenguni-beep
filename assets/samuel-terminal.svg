      <tspan x="45" dy="15">    ==++++==++**##****###%%%%%%%%%%%%%%   </tspan>
      <tspan x="45" dy="15">    ===+=====+**##%%%%%%%%#####%%%%%%%@   </tspan>
      <tspan x="45" dy="15">     ==+++=====+**##****++**##%%%%%%@@    </tspan>
      <tspan x="45" dy="15">     ==++++=======+++++++*****##%%%@@%    </tspan>
    </text>
  </g>

  <text x="522" y="100" class="mono" font-size="21" font-weight="700" fill="#58a6ff">samuelenguni-beep</text>
  <text x="746" y="100" class="mono" font-size="21" fill="#8b949e">@github</text>
  <rect x="522" y="116" width="620" height="2" fill="url(#accent)"/>

  <g>
    <text x="522" y="154" class="label">NAME</text><text x="680" y="154" class="value">Samuel Lima</text>
    <text x="522" y="186" class="label">ROLE</text><text x="680" y="186" class="value">Manutenção Elétrica &amp; Automação</text>
    <text x="522" y="218" class="label">FOCUS</text><text x="680" y="218" class="value">CLP · IHM · Siemens TIA Portal</text>
    <text x="522" y="250" class="label">DRIVES</text><text x="680" y="250" class="value">Siemens · WEG · Danfoss</text>
    <text x="522" y="282" class="label">NETWORK</text><text x="680" y="282" class="value">Modbus · Redes Industriais</text>
    <text x="522" y="314" class="label">MISSION</text><text x="680" y="314" class="value">Tecnologia aplicada ao aprendizado</text>
  </g>

  <text x="522" y="366" class="mono" font-size="16" font-weight="700" fill="#bc8cff">PROJECTS</text>
  <line x1="610" y1="360" x2="1142" y2="360" stroke="#30363d"/>
  <g class="project">
    <text x="528" y="400" fill="#f0f6fc">›</text><text x="552" y="400">Simulador de Inversores</text>
    <text x="528" y="432" fill="#f0f6fc">›</text><text x="552" y="432">Simu Comandos</text>
    <text x="528" y="464" fill="#f0f6fc">›</text><text x="552" y="464">AlignLab</text>
    <text x="528" y="496" fill="#f0f6fc">›</text><text x="552" y="496">Simulador de Fator de Potência</text>
    <text x="528" y="528" fill="#f0f6fc">›</text><text x="552" y="528">LimaMaint</text>
  </g>

  <line x1="522" y1="566" x2="1142" y2="566" stroke="#30363d"/>
  <text x="522" y="602" class="mono" font-size="16" fill="#8b949e">STATUS</text>
  <circle cx="604" cy="596" r="6" fill="#f0f6fc" filter="url(#glow)"/>
  <text x="620" y="602" class="mono" font-size="16" fill="#c9d1d9">building practical industrial tools</text>
  <text x="522" y="635" class="mono" font-size="14" fill="#58a6ff">$ automation --learn --simulate --evolve</text>
</svg>
